<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>GoldCrest Education — Victorian Selective Entry Exam Prep</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Zilla+Slab:ital,wght@0,500;0,600;0,700;1,500;1,600&family=Archivo:wght@500;600;700;800&family=Public+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
<script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
<script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
<style>
  :root{
    --ink:#1C2B29;
    --ink-soft:#374B48;
    --paper:#EAF0EF;
    --paper-dim:#DCE7E5;
    --plum:#8C3345;
    --plum-deep:#6E2536;
    --gold:#C9962C;
    --gold-deep:#A87A1E;
    --teal:#3E7C74;
    --pencil:#5C665F;
    --line:#CFCDB4;
  }
  *{box-sizing:border-box;}
  html,body,#root{height:100%;}
  body{ margin:0; background:var(--paper); color:var(--ink); font-family:'Public Sans',sans-serif; overflow:hidden; }
  .app{ height:100vh; display:flex; flex-direction:column; position:relative; }
  .topbar{
    display:flex; align-items:center; justify-content:space-between;
    padding:22px 44px; border-bottom:1px solid var(--line); flex-shrink:0;
  }
  .brand{
    display:flex; align-items:center; gap:11px; font-family:'Zilla Slab',serif; font-weight:700;
    font-size:22px; letter-spacing:-0.01em; color:var(--ink);
  }
  .brand-mark{ width:34px; height:34px; flex-shrink:0; transition:transform .35s cubic-bezier(.2,.8,.2,1); }
  .brand-logo-img{ height:46px; width:auto; display:block; flex-shrink:0; }
  .brand-tagline{
    font-family:'Archivo',sans-serif; font-weight:700; font-size:15.5px; letter-spacing:0.005em;
    color:var(--plum-deep); border-left:2px solid var(--gold); padding-left:14px; max-width:18ch; line-height:1.3;
  }
  .brand:hover .brand-mark{ transform:rotate(-8deg) scale(1.06); }
  .tabs{ display:flex; gap:4px; background:var(--paper-dim); padding:5px; border-radius:12px; }
  .tab-btn{
    font-family:'Archivo',sans-serif; font-weight:600; font-size:14.5px; padding:10px 20px;
    border:none; background:transparent; color:var(--pencil); border-radius:8px; cursor:pointer;
    transition:all .18s ease; letter-spacing:0.01em;
  }
  .tab-btn:hover{ color:var(--ink); }
  .tab-btn.active{ background:var(--ink); color:var(--paper); }
  .cta-top{
    font-family:'Archivo',sans-serif; font-weight:600; font-size:14px; padding:11px 22px;
    border-radius:9px; background:var(--plum); color:#fff; border:none; cursor:pointer;
    transition:transform .15s ease, background .15s ease; white-space:nowrap; text-align:center;
  }
  .cta-top:hover{ background:var(--plum-deep); transform:translateY(-1px); }

  .content{ flex:1; padding:0 44px; display:flex; align-items:stretch; min-height:0; }
  .panel{ width:100%; height:100%; display:flex; align-items:center; animation:rise .38s cubic-bezier(.2,.8,.2,1); }
  @keyframes rise{ from{ opacity:0; transform:translateY(10px); } to{ opacity:1; transform:translateY(0); } }
  @media (prefers-reduced-motion: reduce){ .panel{ animation:none; } }

  .eyebrow{
    font-family:'Archivo',sans-serif; font-size:16.5px; font-weight:800; letter-spacing:0.005em;
    color:var(--plum-deep); margin-bottom:14px; display:block;
  }
  h1.display{
    font-family:'Zilla Slab',serif; font-weight:700; font-size:clamp(28px,3.1vw,46px);
    line-height:1.08; letter-spacing:-0.01em; margin:0 0 18px 0; max-width:14ch;
  }
  p.lede{ font-size:16.5px; line-height:1.55; color:var(--ink-soft); max-width:46ch; margin:0 0 26px 0; }
  .hl{
    color:var(--plum-deep); font-weight:800; text-decoration:none;
    border-bottom:3px solid var(--gold); padding-bottom:1px;
  }

  /* ===== TAB 1 ===== */
  .diff-grid{ display:grid; grid-template-columns:0.85fr 1.15fr; gap:56px; width:100%; align-items:center; }
  .diff-left{ padding-right:10px; }
  .compare{
    background:#fff; border:2px solid var(--ink); border-radius:16px; overflow:hidden;
    box-shadow:0 30px 64px -24px rgba(28,43,41,0.5);
    transform:scale(1.04);
  }
  .compare-row{
    display:grid; grid-template-columns:1.3fr 1fr 1fr; align-items:center; padding:16px 0;
    border-bottom:1px solid var(--line); font-size:14.5px; transition:background .15s ease;
  }
  .compare-row:hover{ background:#F6F5EA; }
  .compare-row:last-child{ border-bottom:none; }
  .compare-row > span{ padding:0 20px; border-right:1px solid var(--line); }
  .compare-row > span:last-child{ border-right:none; }
  .compare-row.head{
    background:var(--ink); color:var(--paper); font-family:'Zilla Slab',serif; font-size:16.5px;
    letter-spacing:0; font-weight:700;
  }
  .compare-row.head > span{ border-right:1px solid rgba(236,235,221,0.18); }
  .compare-row.head:hover{ background:var(--ink); }
  .compare-row .label{ color:var(--ink-soft); font-weight:500; }
  .tick{ color:var(--plum-deep); font-weight:700; }
  .cross{ color:#8A7452; }
  .mono-small{ font-family:'Archivo',sans-serif; }



  /* ===== TAB 2 ===== */
  .offer-grid{ display:grid; grid-template-columns:repeat(5,1fr); gap:16px; width:100%; }
  .offer-head{ grid-column:1 / -1; margin-bottom:6px; }
  .offer-card{
    background:#fff; border:2.5px solid var(--plum); border-radius:16px; padding:20px 17px;
    display:flex; flex-direction:column; gap:9px; position:relative;
    box-shadow:0 24px 48px -26px rgba(140,51,69,0.35);
    transition:transform .18s ease, box-shadow .18s ease; cursor:default;
  }
  .offer-card:hover{ transform:translateY(-4px); box-shadow:0 20px 40px -24px rgba(28,43,41,0.3); }
  .offer-num{ font-family:'Archivo',sans-serif; font-size:12px; color:var(--plum); font-weight:600; }
  .offer-title{ font-family:'Zilla Slab',serif; font-weight:700; font-size:17.5px; color:var(--ink); }
  .offer-desc{ font-size:13px; line-height:1.5; color:var(--ink-soft); }

  /* ===== TAB 3 ===== */
  .plans-wrap{ width:100%; }
  .plans-head{ margin-bottom:22px; }
  .plans-grid{ display:grid; grid-template-columns:repeat(4,1fr); gap:18px; }
  .plan-card{
    background:#fff; border:2.5px solid var(--plum); border-radius:18px; padding:26px 22px;
    position:relative; display:flex; flex-direction:column; min-height:210px;
    box-shadow:0 24px 48px -26px rgba(140,51,69,0.35);
  }
  .plan-card.featured{ border-color:var(--plum); border-width:2.5px; box-shadow:0 24px 48px -26px rgba(140,51,69,0.35); }
  .plan-card.custom{ border-style:solid; border-color:var(--gold-deep); background:#fff; }
  .plan-tag{
    position:absolute; top:-11px; right:20px; background:var(--plum); color:#fff;
    font-family:'Archivo',sans-serif; font-size:11.5px; font-weight:700; letter-spacing:0.01em;
    padding:5px 10px; border-radius:6px;
  }
  .plan-name{
    font-family:'Zilla Slab',serif; font-style:italic; font-weight:600; font-size:16px;
    color:var(--plum-deep); margin-bottom:10px; letter-spacing:0; position:relative; display:inline-block;
  }
  .plan-name::after{
    content:""; position:absolute; left:0; bottom:-4px; width:28px; height:3px; background:var(--gold);
  }
  .plan-price{
    font-family:'Zilla Slab',serif; font-weight:700; font-size:38px; color:var(--ink);
    line-height:1; margin-bottom:2px; transition:opacity .15s ease;
  }
  .plan-price span{ font-family:'Archivo',sans-serif; font-size:14px; font-weight:600; color:var(--pencil); }
  .plan-total{ font-size:12.5px; color:var(--ink-soft); margin-bottom:16px; }
  .plan-btn{
    margin-top:auto; padding:12px; border-radius:9px; border:1.5px solid var(--ink);
    background:var(--ink); color:var(--paper); font-family:'Archivo',sans-serif; font-weight:600;
    font-size:14px; cursor:pointer; transition:all .15s ease;
  }
  .plan-btn:hover{ background:var(--plum-deep); border-color:var(--plum-deep); }

  .weeks-input-row{ display:flex; align-items:center; gap:8px; margin-bottom:16px; }
  .weeks-input{
    width:70px; padding:10px; border-radius:8px; border:1.5px solid var(--line); background:#fff;
    font-family:'Archivo',sans-serif; font-size:16px; font-weight:600; color:var(--ink); text-align:center;
  }
  .weeks-input:focus{ outline:none; border-color:var(--plum); }
  .weeks-suffix{ font-family:'Archivo',sans-serif; font-size:13px; color:var(--pencil); }
  .custom-live{
    font-family:'Archivo',sans-serif; font-size:11.5px; color:var(--plum-deep); margin-bottom:4px; min-height:14px;
  }

  /* ===== Perk modal ===== */
  .modal-overlay{
    position:fixed; inset:0; background:rgba(28,43,41,0.45); display:flex; align-items:center;
    justify-content:center; z-index:50; animation:fadeIn .18s ease;
  }
  @keyframes fadeIn{ from{opacity:0;} to{opacity:1;} }
  .modal-box{
    background:#fff; border-radius:18px; padding:30px 32px; width:460px; max-width:90vw;
    box-shadow:0 40px 80px -30px rgba(28,43,41,0.5); position:relative;
  }
  .modal-close{
    position:absolute; top:16px; right:18px; background:none; border:none; font-size:18px;
    color:var(--pencil); cursor:pointer; line-height:1;
  }
  .modal-title{ font-family:'Zilla Slab',serif; font-weight:700; font-size:22px; margin:0 0 6px 0; color:var(--ink); }
  .modal-sub{ font-size:13.5px; color:var(--ink-soft); margin:0 0 20px 0; }
  .perk-list{ display:flex; flex-direction:column; gap:10px; }
  .perk-option{
    display:flex; align-items:center; gap:12px; padding:13px 14px; border-radius:11px;
    border:1.5px solid var(--line); cursor:pointer; transition:all .15s ease; background:#fff;
  }
  .perk-option:hover:not(.disabled){ border-color:var(--plum); background:#FBF8F0; }
  .perk-option.selected{ border-color:var(--gold-deep); background:#FBF3E3; }
  .perk-option.disabled{ opacity:0.4; cursor:not-allowed; }
  .perk-radio{
    width:17px; height:17px; border-radius:50%; border:1.5px solid var(--pencil); flex-shrink:0;
    display:flex; align-items:center; justify-content:center;
  }
  .perk-radio.on{ border-color:var(--plum); }
  .perk-radio.on::after{ content:""; width:9px; height:9px; border-radius:50%; background:var(--plum); }
  .perk-text{ font-size:13.5px; color:var(--ink); }
  .perk-note{ font-size:11.5px; color:var(--pencil); margin-top:1px; }
  .modal-confirm{
    margin-top:22px; width:100%; padding:13px; border-radius:10px; border:none;
    background:var(--ink); color:var(--paper); font-family:'Archivo',sans-serif; font-weight:600;
    font-size:14.5px; cursor:pointer; transition:background .15s ease;
  }
  .modal-confirm:hover{ background:var(--plum-deep); }
</style>
<!-- KaTeX -->
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.8/dist/katex.min.css">
<script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.8/dist/katex.min.js"></script>
<script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.8/dist/contrib/auto-render.min.js"></script>
</head>
<body>
<div id="root"></div>
<script type="text/babel">
const {useState, useEffect} = React;

const LatexText = ({ text }) => {
  const containerRef = React.useRef(null);
  React.useEffect(() => {
    if (containerRef.current && window.renderMathInElement) {
      window.renderMathInElement(containerRef.current, {
        delimiters: [
          {left: '$$', right: '$$', display: true},
          {left: '$', right: '$', display: false},
          {left: '\\(', right: '\\)', display: false},
          {left: '\\[', right: '\\]', display: true}
        ],
        throwOnError: false
      });
    }
  }, [text]);
  return <div ref={containerRef} dangerouslySetInnerHTML={{ __html: text }} />;
};

const TestTakingPanel = ({ onTestSubmit, userId }) => {
  const [questions, setQuestions] = useState([]);
  const [currentIdx, setCurrentIdx] = useState(0);
  const [answers, setAnswers] = useState({});
  const [timeTaken, setTimeTaken] = useState(0);
  
  useEffect(() => {
    fetch('http://localhost:8000/api/test/generate', {
      method: 'POST',
      headers: {'Content-Type': 'application/json'},
      body: JSON.stringify({ user_id: userId })
    })
    .then(res => res.json())
    .then(data => setQuestions(data.questions));
    
    const timer = setInterval(() => setTimeTaken(t => t + 1), 1000);
    return () => clearInterval(timer);
  }, [userId]);

  if (questions.length === 0) return <div>Loading test...</div>;
  const currentQ = questions[currentIdx];

  const handleSelect = (opt) => {
    setAnswers({ ...answers, [currentQ.id]: opt });
  };

  const handleSubmit = async () => {
    const attempts = questions.map(q => ({
       question_id: q.id,
       is_correct: answers[q.id] === q.correct_option, 
       time_taken_seconds: Math.floor(timeTaken / questions.length)
    }));
    await fetch('http://localhost:8000/api/test/submit', {
      method: 'POST',
      headers: {'Content-Type': 'application/json'},
      body: JSON.stringify({ user_id: userId, attempts })
    });
    onTestSubmit();
  };

  return (
    <div className="panel" style={{flexDirection: 'column', alignItems: 'flex-start', width: '100%'}}>
      <span className="eyebrow">Question {currentIdx + 1} of {questions.length} | Timer: {timeTaken}s</span>
      <h2 style={{fontFamily: 'Zilla Slab', marginBottom: '20px', width: '100%'}}>
        <LatexText text={currentQ.text} />
      </h2>
      <div style={{display: 'flex', flexDirection: 'column', gap: '10px', width: '100%'}}>
        {currentQ.options.map((opt, i) => (
          <button 
            key={i}
            className={`perk-option ${answers[currentQ.id] === opt ? 'selected' : ''}`}
            onClick={() => handleSelect(opt)}
            style={{textAlign: 'left', fontSize: '16px', width: '100%'}}
          >
             <LatexText text={opt} />
          </button>
        ))}
      </div>
      <div style={{marginTop: '30px', display: 'flex', gap: '10px'}}>
        <button className="plan-btn" disabled={currentIdx === 0} onClick={() => setCurrentIdx(i => i - 1)}>Previous</button>
        {currentIdx < questions.length - 1 ? (
          <button className="plan-btn" onClick={() => setCurrentIdx(i => i + 1)}>Next</button>
        ) : (
          <button className="cta-top" onClick={handleSubmit}>Submit Test</button>
        )}
      </div>
    </div>
  );
};

const ReviewPanel = ({ attemptId }) => {
  const [reviewData, setReviewData] = useState(null);
  const [showApproach, setShowApproach] = useState(false);
  const [chat, setChat] = useState([]);
  const [query, setQuery] = useState("");

  useEffect(() => {
    fetch(`http://localhost:8000/api/test/review/${attemptId}`)
      .then(res => res.json())
      .then(data => setReviewData(data));
  }, [attemptId]);

  if (!reviewData) return <div>Loading detailed review...</div>;

  const handleAskDoubt = async () => {
    if(!query) return;
    const newChat = [...chat, { role: 'user', text: query }];
    setChat(newChat);
    setQuery("");
    
    const res = await fetch('http://localhost:8000/api/test/doubt', {
      method: 'POST',
      headers: {'Content-Type': 'application/json'},
      body: JSON.stringify({ attempt_id: attemptId, user_query: query })
    });
    const data = await res.json();
    setChat([...newChat, { role: 'ai', text: data.explanation }]);
  };

  return (
    <div className="panel" style={{flexDirection: 'column', alignItems: 'flex-start', overflowY: 'auto', paddingBottom: '40px', width: '100%'}}>
      <span className="eyebrow" style={{color: reviewData.is_correct ? 'var(--teal)' : 'var(--plum)'}}>
        {reviewData.is_correct ? 'Correct' : 'Incorrect'}
      </span>
      <h2 style={{fontFamily: 'Zilla Slab', marginBottom: '20px', width: '100%'}}>
        <LatexText text={reviewData.question_text} />
      </h2>
      <div style={{display: 'flex', flexDirection: 'column', gap: '10px', width: '100%'}}>
        {reviewData.options.map((opt, i) => {
          let bgColor = '#fff';
          let borderColor = 'var(--line)';
          if (opt === reviewData.correct_option) {
             bgColor = '#e6f4ea';
             borderColor = 'var(--teal)';
          } else if (!reviewData.is_correct) {
             bgColor = '#fce8e6';
             borderColor = 'var(--plum)';
          }
          return (
            <div key={i} className="perk-option" style={{backgroundColor: bgColor, borderColor: borderColor, width: '100%'}}>
              <LatexText text={opt} />
            </div>
          );
        })}
      </div>
      <button className="plan-btn" style={{marginTop: '20px'}} onClick={() => setShowApproach(!showApproach)}>
        {showApproach ? 'Hide Detailed Approach' : 'View Detailed Approach'}
      </button>
      {showApproach && (
        <div style={{marginTop: '20px', padding: '20px', background: 'var(--paper-dim)', borderRadius: '12px', width: '100%'}}>
          <h4 style={{margin: '0 0 10px 0'}}>Concept Used:</h4>
          <p><LatexText text={reviewData.concept_used} /></p>
          <h4 style={{margin: '15px 0 10px 0'}}>Step by Step Solution:</h4>
          <p><LatexText text={reviewData.step_by_step_solution} /></p>
          <h4 style={{margin: '15px 0 10px 0', color: 'var(--plum)'}}>Common Trap:</h4>
          <p><LatexText text={reviewData.common_trap} /></p>
        </div>
      )}
      <div style={{marginTop: '40px', width: '100%', borderTop: '2px solid var(--line)', paddingTop: '20px'}}>
        <h3 style={{fontFamily: 'Zilla Slab'}}>Contextual Doubt Solver</h3>
        <div style={{display: 'flex', flexDirection: 'column', gap: '10px', marginBottom: '15px'}}>
          {chat.map((msg, i) => (
            <div key={i} style={{
              alignSelf: msg.role === 'user' ? 'flex-end' : 'flex-start',
              background: msg.role === 'user' ? 'var(--ink)' : 'var(--paper-dim)',
              color: msg.role === 'user' ? '#fff' : 'var(--ink)',
              padding: '10px 15px', borderRadius: '12px', maxWidth: '80%'
            }}>
              <LatexText text={msg.text} />
            </div>
          ))}
        </div>
        <div style={{display: 'flex', gap: '10px', width: '100%'}}>
          <input 
            type="text" 
            value={query}
            onChange={(e) => setQuery(e.target.value)}
            style={{flex: 1, padding: '10px', borderRadius: '8px', border: '1px solid var(--line)'}}
            placeholder="Ask why your logic failed..."
          />
          <button className="cta-top" onClick={handleAskDoubt}>Ask Tutor</button>
        </div>
      </div>
    </div>
  );
};

function BrandMark(){
  return <img src={LOGO_SRC} alt="GoldCrest Education" className="brand-logo-img"/>;
}

function EmailGateModal({onClose, onContinue, onOpenPrivacy}){
  const [email,setEmail] = useState("");
  const [agreed,setAgreed] = useState(false);
  const validEmail = /^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email);
  const canContinue = validEmail && agreed;

  const handleContinue = ()=>{
    if(!canContinue) return;
    onContinue();
  };

  return (
    <div className="modal-overlay" onClick={onClose}>
      <div className="modal-box" onClick={e=>e.stopPropagation()}>
        <button className="modal-close" onClick={onClose}>✕</button>
        <h3 className="modal-title">Start your demo test</h3>
        <p className="modal-sub">Enter your email to begin the 5-question demo test.</p>
        <input
          type="email"
          className="weeks-input"
          style={{width:"100%", textAlign:"left", marginBottom:16}}
          placeholder="parent@email.com"
          value={email}
          onChange={e=>setEmail(e.target.value)}
        />
        <label style={{display:"flex", alignItems:"flex-start", gap:10, fontSize:12.5, color:"var(--ink-soft)", cursor:"pointer", marginBottom:6}}>
          <input
            type="checkbox"
            checked={agreed}
            onChange={e=>setAgreed(e.target.checked)}
            style={{marginTop:2}}
          />
          <span>
            By continuing, you agree to our{" "}
            <a href="#" onClick={(e)=>{e.preventDefault(); onOpenPrivacy();}} style={{color:"var(--plum-deep)", fontWeight:600}}>
              Privacy Policy
            </a>.
          </span>
        </label>
        <button
          className="modal-confirm"
          disabled={!canContinue}
          style={{opacity:canContinue?1:0.5, marginTop:16}}
          onClick={handleContinue}
        >
          Continue
        </button>
      </div>
    </div>
  );
}

function TopBar({tab,setTab,onOpenGate}){
  const tabs = ["How we're different","What we offer","Plans"];
  return (
    <div className="topbar">
      <div className="brand">
        <BrandMark/>
        <span className="brand-tagline">Victorian Selective Entry Exam Prep</span>
      </div>
      <div className="tabs">
        {tabs.map(t=>(
          <button key={t} className={"tab-btn"+(tab===t?" active":"")} onClick={()=>setTab(t)}>{t}</button>
        ))}
      </div>
      <button className="cta-top" onClick={onOpenGate}>Attempt a 5-Question Demo Test</button>
    </div>
  );
}

function PrivacyPolicyPage({onBack}){
  return (
    <div style={{padding:"60px 44px", maxWidth:680, margin:"0 auto"}}>
      <button className="tab-btn" style={{marginBottom:24}} onClick={onBack}>← Back</button>
      <h1 className="display" style={{maxWidth:"none"}}>Privacy Policy</h1>
      <p className="lede" style={{maxWidth:"none"}}>Privacy Policy</p>
    </div>
  );
}

function DemoTestPage({onBack}){
  const [testState, setTestState] = useState('taking');
  const [attemptId, setAttemptId] = useState(1);

  return (
    <div style={{padding:"60px 44px", maxWidth:800, margin:"0 auto"}}>
      <button className="tab-btn" style={{marginBottom:24}} onClick={onBack}>← Back</button>
      {testState === 'taking' ? (
        <TestTakingPanel userId={1} onTestSubmit={() => setTestState('review')} />
      ) : (
        <ReviewPanel attemptId={attemptId} />
      )}
    </div>
  );
}

function CountUp({to}){
  const [val,setVal] = useState(0);
  useEffect(()=>{
    let frame;
    const start = performance.now();
    const dur = 900;
    function tick(now){
      const p = Math.min(1,(now-start)/dur);
      setVal(Math.round(to * (1-Math.pow(1-p,3))));
      if(p<1) frame = requestAnimationFrame(tick);
    }
    frame = requestAnimationFrame(tick);
    return ()=>cancelAnimationFrame(frame);
  },[to]);
  return <span>{val}</span>;
}

const PERKS = [
  { id:"free_week", label:"Try it risk-free", note:"Not happy? Cancel any time and we'll refund the total amount of all the weeks left + the current week.", min:5 },
  { id:"five_off", label:"5% off", note:"Applies to plans of 10 weeks or more.", min:10 },
  { id:"bonus_papers", label:"5 bonus papers", note:"Use them any time during your plan. Applies to plans of 5 weeks or more.", min:5 },
  { id:"rollover", label:"Rollover unused papers", note:"If you use only 1 or no papers in a given week, the remaining papers out of 3 will be carried forward to the next week." },
];

function PerkModal({planWeeks, planLabel, onClose}){
  const [chosen,setChosen] = useState(null);
  const eligible = (perk)=> !perk.min || planWeeks >= perk.min;
  return (
    <div className="modal-overlay" onClick={onClose}>
      <div className="modal-box" onClick={e=>e.stopPropagation()}>
        <button className="modal-close" onClick={onClose}>✕</button>
        <h3 className="modal-title">Pick one perk</h3>
        <p className="modal-sub">You're starting the {planLabel} plan. Choose the one perk you'd like with it.</p>
        <p className="modal-sub" style={{fontWeight:700, color:'var(--plum-deep)'}}>Your plan will begin next Monday, 12AM AEST.</p>
        <div className="perk-list">
          {PERKS.map(p=>{
            const ok = eligible(p);
            const sel = chosen===p.id;
            return (
              <div
                key={p.id}
                className={"perk-option"+(sel?" selected":"")+(ok?"":" disabled")}
                onClick={()=> ok && setChosen(p.id)}
              >
                <div className={"perk-radio"+(sel?" on":"")}></div>
                <div>
                  <div className="perk-text">{p.label}</div>
                  <div className="perk-note">{ok ? p.note : `Needs a plan of ${p.min}+ weeks.`}</div>
                </div>
              </div>
            );
          })}
        </div>
        <button className="modal-confirm" disabled={!chosen} style={{opacity:chosen?1:0.5}} onClick={onClose}>
          Confirm {planLabel} plan
        </button>
      </div>
    </div>
  );
}

function PlansPanel(){
  const [weeks,setWeeks] = useState("");
  const n = parseInt(weeks,10);
  const valid = !isNaN(n) && n > 10;
  const rate = valid ? Math.max(3, 5 - 0.05*(n-10)) : null;
  const total = valid ? (rate*n) : null;
  const [modal,setModal] = useState(null); // {weeks, label}

  return (
    <div className="plans-wrap">
      <div className="plans-head">
        <h1 className="display" style={{marginBottom:0, maxWidth:'26ch'}}>Pick a length. Pick one perk.<br/>Begin your preparation journey with us.</h1>
      </div>
      <div className="plans-grid">
        <div className="plan-card">
          <span className="plan-name">3 weeks</span>
          <div className="plan-price">$7<span>/week</span></div>
          <div className="plan-total">$21 total, billed upfront</div>
          <button className="plan-btn" onClick={()=>setModal({weeks:3,label:"3-week"})}>Choose 3 weeks</button>
        </div>
        <div className="plan-card featured">
          <span className="plan-name">5 weeks</span>
          <div className="plan-price">$6<span>/week</span></div>
          <div className="plan-total">$30 total, billed upfront</div>
          <button className="plan-btn" onClick={()=>setModal({weeks:5,label:"5-week"})}>Choose 5 weeks</button>
        </div>
        <div className="plan-card">
          <span className="plan-name">10 weeks</span>
          <div className="plan-price">$5<span>/week</span></div>
          <div className="plan-total">$50 total, billed upfront</div>
          <button className="plan-btn" onClick={()=>setModal({weeks:10,label:"10-week"})}>Choose 10 weeks</button>
        </div>
        <div className="plan-card custom">
          <span className="plan-name">More than 10 weeks</span>
          <div className="weeks-input-row">
            <input
              className="weeks-input"
              type="number"
              min="11"
              placeholder="12"
              value={weeks}
              onChange={e=>setWeeks(e.target.value)}
            />
            <span className="weeks-suffix">weeks</span>
          </div>
          <div className="custom-live">
            {valid ? `$${rate.toFixed(2)} per week` : "Type a number above 10."}
          </div>
          <div className="plan-price">
            {valid ? <span>${total.toFixed(0)}</span> : <span style={{opacity:0.3}}>$0</span>}
            <span> total</span>
          </div>
          <div className="plan-total">The longer you go, the lower the rate. Down to $3 a week.</div>
          <button
            className="plan-btn"
            disabled={!valid}
            style={{opacity:valid?1:0.4}}
            onClick={()=> valid && setModal({weeks:n,label:`${n}-week`})}
          >
            Choose {valid?n:''} weeks
          </button>
        </div>
      </div>
      {modal && (
        <PerkModal planWeeks={modal.weeks} planLabel={modal.label} onClose={()=>setModal(null)} />
      )}
    </div>
  );
}

function App(){
  const [tab,setTab] = useState("How we're different");
  const [page,setPage] = useState("main"); // main | privacy-policy | demo-test
  const [showEmailGate,setShowEmailGate] = useState(false);

  if(page === "privacy-policy"){
    return <PrivacyPolicyPage onBack={()=>setPage("main")} />;
  }
  if(page === "demo-test"){
    return <DemoTestPage onBack={()=>setPage("main")} />;
  }

  return (
    <div className="app">
      <TopBar tab={tab} setTab={setTab} onOpenGate={()=>setShowEmailGate(true)} />
      <div className="content">
        <div className="panel" key={tab}>
          {tab==="How we're different" && <DifferentPanel/>}
          {tab==="What we offer" && <OfferPanel/>}
          {tab==="Plans" && <PlansPanel/>}
        </div>
      </div>
      {showEmailGate && (
        <EmailGateModal
          onClose={()=>setShowEmailGate(false)}
          onContinue={()=>{ setShowEmailGate(false); setPage("demo-test"); }}
          onOpenPrivacy={()=>{ setShowEmailGate(false); setPage("privacy-policy"); }}
        />
      )}
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script>
